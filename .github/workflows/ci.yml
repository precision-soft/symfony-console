name: ci

on:
    push:
        branches: [ main ]
    pull_request:
    workflow_dispatch:

# read-only: nothing here tags or publishes, so a write-scoped token would only ever be an offer
permissions:
    contents: read

# A second push to the same branch makes the first run's answer worthless before it finishes.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # these read the same bytes on every interpreter, so once rather than three times; php-cs-fixer
    # would also print a meaningless min-version warning above composer.json's floor
    static:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            -   uses: actions/checkout@v7
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
                    coverage: none
            -   name: validate the manifest
                run: composer validate --strict
            -   name: resolve the composer cache directory
                id: composer-cache
                run: echo "path=$(composer config --global cache-files-dir)" >> "${GITHUB_OUTPUT}"
            -   uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.path }}
                    key: composer-8.2-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-8.2-
            # installed, never resolved: a job resolving its own would certify this code with a different analyser
            -   name: install the locked dependencies
                run: composer install --no-progress --no-interaction --prefer-dist
            -   name: cs check
                run: composer cs-check

    # phpstan's inference follows the interpreter, so it belongs in the matrix. The integration group
    # needs no service here, hence no job of its own; --fail-on-skipped because that suite skips only
    # when the real phpunit binary is absent, which after `composer install` means a broken install.
    # Every other package resolves this one through `^3.0`, so a red leg here warns six suites early
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                php: [ '8.2', '8.3', '8.4', '8.5' ]
        steps:
            -   uses: actions/checkout@v7
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    coverage: none
            -   name: resolve the composer cache directory
                id: composer-cache
                run: echo "path=$(composer config --global cache-files-dir)" >> "${GITHUB_OUTPUT}"
            -   uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.path }}
                    key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-${{ matrix.php }}-
            -   name: install the locked dependencies
                run: composer install --no-progress --no-interaction --prefer-dist
            # simple-phpunit builds a phpunit tree composer.lock does not describe; cached after the
            # install, since composer owns vendor/ and would clean a pre-restored directory back out
            -   uses: actions/cache@v6
                with:
                    path: vendor/bin/.phpunit
                    key: phpunit-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
            -   name: phpstan
                run: composer phpstan
            -   name: test
                run: composer test
            -   name: integration suite
                run: composer test-integration -- --fail-on-skipped

    # every other lane installs composer.lock so the analysers certify one reproducible dependency set;
    # this one resolves the upper bound instead, on the only interpreter Symfony 8 will install on
    latest-deps:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            -   uses: actions/checkout@v7
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    coverage: none
            -   name: resolve the composer cache directory
                id: composer-cache
                run: echo "path=$(composer config --global cache-files-dir)" >> "${GITHUB_OUTPUT}"
            -   uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.path }}
                    key: composer-8.5-latest-${{ hashFiles('composer.json') }}
                    restore-keys: composer-8.5-latest-
            # config.platform.php pins resolution to the 8.2 floor so the lock installs everywhere; this is
            # the one job that wants the ceiling instead, and symfony 8 needs php 8.4
            -   name: drop the platform pin
                run: composer config --unset platform.php
            -   name: resolve the highest allowed dependencies
                run: composer update --no-progress --no-interaction --prefer-dist --with-all-dependencies
            -   name: report what resolved
                run: composer show --direct
            # without this the job goes green on a symfony 7 resolution and proves nothing
            -   name: assert the resolution reached symfony 8
                run: |
                    set -euo pipefail
                    RESOLVED="$(composer show --direct --format=json | jq -r '.installed[] | select(.name | startswith("symfony/")) | select(.name | startswith("symfony/polyfill-") | not) | "\(.name) \(.version)"')"
                    if [ -z "${RESOLVED}" ]; then
                        echo "no direct symfony package, nothing to assert"
                        exit 0
                    fi
                    echo "${RESOLVED}" | while read -r PACKAGE VERSION; do
                        echo "${PACKAGE}: ${VERSION}"
                        case "${VERSION}" in
                            v8.*|8.*) ;;
                            *) echo "expected ${PACKAGE} 8.x, resolved ${VERSION}" >&2; exit 1 ;;
                        esac
                    done
            -   name: phpstan against the resolved set
                run: composer phpstan
            -   name: test against the resolved set
                run: composer test -- --fail-on-skipped
            -   name: integration suite against the resolved set
                run: composer test-integration -- --fail-on-skipped

    # `--locked` reads composer.lock, so no vendor/ and no install step; kept out of `composer check`
    # because it is the only section needing the network
    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            -   uses: actions/checkout@v7
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
                    coverage: none
            -   name: audit the locked dependencies
                run: composer deps-audit
